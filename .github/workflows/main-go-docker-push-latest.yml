name: Main Go Docker Push (Latest)

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: opensvc

jobs:
  # The tests without and with race detector run side by side, each on a
  # runner of its own: the images are pushed once both passed.
  build-and-test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # Ensures full history and tags are fetched

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Locate the Go caches
        id: go-cache
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      # The build cache of the job, of its own as the race detector one: the
      # cache setup-go keeps, one for both jobs, held the objects of the job
      # saving it first, and the other compiled everything again.
      # main saves the cache of each push, which the pull requests and the
      # releases restore without saving it.
      - name: Restore and save the Go caches
        uses: actions/cache@v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.build }}
            ${{ steps.go-cache.outputs.mod }}
          key: go-build-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-
            go-build-${{ runner.os }}-

      - name: set opensvc version file
        run: git describe --tags --abbrev > ./util/version/text/VERSION

      - name: Go build om
        run: go build -v -o ./bin/om ./cmd/om

      - name: Show om version
        run: ./bin/om --version

      - name: Go build ox
        run: go build -v -o ./bin/ox ./cmd/ox

      - name: Show ox version
        run: ./bin/ox --version

      # Compiled as the runner user, in the caches above, and run as root:
      # sudo go test compiled in the caches of root, which nothing restores.
      - name: Run Go tests
        run: CGO_ENABLED=0 go test -exec sudo -ldflags=-w -timeout 120s ./...

  race-test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # Ensures full history and tags are fetched

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Locate the Go caches
        id: go-cache
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      # The build cache of the race detector, of its own: see build-and-test.
      # main saves the cache of each push, which the pull requests and the
      # releases restore without saving it.
      - name: Restore and save the Go caches
        uses: actions/cache@v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.build }}
            ${{ steps.go-cache.outputs.mod }}
          key: go-race-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-race-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-
            go-race-${{ runner.os }}-

      - name: set opensvc version file
        run: git describe --tags --abbrev > ./util/version/text/VERSION

      - name: Run Go tests with race detector
        run: go test -exec sudo -ldflags=-w -timeout 600s --race ./...

  build-and-push-latest:
    needs: [build-and-test, race-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # Ensures full history and tags are fetched

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: go.sum

      - name: set opensvc version file
        run: git describe --tags --abbrev > ./util/version/text/VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to the Container registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Extract metadata (tags, labels) for om
        id: meta-om
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/om
          tags: type=raw,value=latest
          labels: |
            org.opencontainers.image.authors=OpenSVC SAS
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=https://github.com/opensvc/om3
            org.opencontainers.image.url=https://github.com/opensvc/om3
            org.opencontainers.image.title=OpenSVC cluster orchestrator
            org.opencontainers.image.version=latest

      - name: Build and push om
        id: build-om
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: docker/om/Dockerfile
          push: true
          tags: ${{ steps.meta-om.outputs.tags }}
          labels: ${{ steps.meta-om.outputs.labels }}

      - name: Sign om image
        run: cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/om@${{ steps.build-om.outputs.digest }}"

      - name: Extract metadata (tags, labels) for ox
        id: meta-ox
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ox
          tags: type=raw,value=latest
          labels: |
            org.opencontainers.image.authors=OpenSVC SAS
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=https://github.com/opensvc/om3
            org.opencontainers.image.url=https://github.com/opensvc/om3
            org.opencontainers.image.title=OpenSVC cluster orchestrator client
            org.opencontainers.image.version=latest

      - name: Build and push ox
        id: build-ox
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: docker/ox/Dockerfile
          push: true
          tags: ${{ steps.meta-ox.outputs.tags }}
          labels: ${{ steps.meta-ox.outputs.labels }}

      - name: Sign ox image
        run: cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ox@${{ steps.build-ox.outputs.digest }}"

      - name: Extract metadata (tags, labels) for omx
        id: meta-omx
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/omx
          tags: type=raw,value=latest
          labels: |
            org.opencontainers.image.authors=OpenSVC SAS
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=https://github.com/opensvc/om3
            org.opencontainers.image.url=https://github.com/opensvc/om3
            org.opencontainers.image.title=OpenSVC cluster orchestrator server & client
            org.opencontainers.image.version=latest

      - name: Build and push omx
        id: build-omx
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: docker/omx/Dockerfile
          push: true
          tags: ${{ steps.meta-omx.outputs.tags }}
          labels: ${{ steps.meta-omx.outputs.labels }}
          # The om and ox images this run built and signed, by digest: a tag
          # another run moves meanwhile would bundle other binaries.
          build-args: |
            OM_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/om@${{ steps.build-om.outputs.digest }}
            OX_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ox@${{ steps.build-ox.outputs.digest }}

      - name: Sign omx image
        run: cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/omx@${{ steps.build-omx.outputs.digest }}"
