name: Main Go Docker Push (Latest)

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: opensvc

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6.0.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: go.sum

      - name: Go build om
        run: go build -v ./cmd/om

      - name: Go build ox
        run: go build -v ./cmd/ox

      - name: Run Go tests
        run: go test -p 1 -timeout 60s ./...

      - name: Run Go tests with race detector
        run: go test -p 1 -timeout 600s --race ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Extract metadata (tags, labels) for om
        id: meta-om
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/om
          tags: type=raw,value=latest

      - name: Build and push om
        id: build-om
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/om/Dockerfile
          push: true
          tags: ${{ steps.meta-om.outputs.tags }}
          labels: |
            ${{ steps.meta-om.outputs.labels }}
            org.opencontainers.image.authors=OpenSVC SAS
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=https://github.com/opensvc/om3
            org.opencontainers.image.url=https://github.com/opensvc/om3
            org.opencontainers.image.title=OpenSVC cluster orchestrator
            org.opencontainers.image.version=latest
          build-args: |
            VERSION=latest
            BUILDTIME=${{ github.event.repository.updated_at }}

      - name: Sign om image
        run: cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/om@${{ steps.build-om.outputs.digest }}"

      - name: Extract metadata (tags, labels) for ox
        id: meta-ox
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ox
          tags: type=raw,value=latest

      - name: Build and push ox
        id: build-ox
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ox/Dockerfile
          push: true
          tags: ${{ steps.meta-ox.outputs.tags }}
          labels: |
            ${{ steps.meta-ox.outputs.labels }}
            org.opencontainers.image.authors=OpenSVC SAS
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=https://github.com/opensvc/om3
            org.opencontainers.image.url=https://github.com/opensvc/om3
            org.opencontainers.image.title=OpenSVC cluster orchestrator client
            org.opencontainers.image.version=latest
          build-args: |
            VERSION=latest
            BUILDTIME=${{ github.event.repository.updated_at }}

      - name: Sign ox image
        run: cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ox@${{ steps.build-ox.outputs.digest }}"

      - name: Extract metadata (tags, labels) for omx
        id: meta-omx
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/omx
          tags: type=raw,value=latest

      - name: Build and push omx
        id: build-omx
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/omx/Dockerfile
          push: true
          tags: ${{ steps.meta-omx.outputs.tags }}
          labels: |
            ${{ steps.meta-omx.outputs.labels }}
            org.opencontainers.image.authors=OpenSVC SAS
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=https://github.com/opensvc/om3
            org.opencontainers.image.url=https://github.com/opensvc/om3
            org.opencontainers.image.title=OpenSVC cluster orchestrator server & client
            org.opencontainers.image.version=latest
          build-args: |
            VERSION=latest
            BUILDTIME=${{ github.event.repository.updated_at }}
            OM_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/om:latest
            OX_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ox:latest

      - name: Sign omx image
        run: cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/omx@${{ steps.build-omx.outputs.digest }}"
