name: PR Go Test

on:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # Ensures full history and tags are fetched

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: go.sum

      - name: set opensvc version file
        run: git describe --tags --abbrev > ./util/version/text/VERSION

      - name: Go build om
        run: sudo go build -v -o ./bin/om ./cmd/om

      - name: Show om version
        run: ./bin/om --version

      - name: Go build ox
        run: sudo go build -v -o ./bin/ox ./cmd/ox

      - name: Show ox version
        run: ./bin/ox --version

      - name: Run Go tests
        run: sudo go test -p 1 -timeout 60s ./...

      - name: Run Go tests with race detector
        run: sudo go test -p 1 -timeout 600s --race ./...
