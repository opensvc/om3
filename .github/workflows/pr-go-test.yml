name: PR Go Test

on:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # Ensures full history and tags are fetched

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Locate the Go caches
        id: go-cache
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      # The build cache of the job, of its own as the race detector one: the
      # cache setup-go keeps, one for both jobs, held the objects of the job
      # saving it first, and the other compiled everything again.
      # The cache main saves on each push: restored only, a save of its own
      # being an upload of a gigabyte the job would wait for.
      - name: Restore the Go caches
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.build }}
            ${{ steps.go-cache.outputs.mod }}
          key: go-build-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-
            go-build-${{ runner.os }}-

      - name: set opensvc version file
        run: git describe --tags --abbrev > ./util/version/text/VERSION

      - name: Go build om
        run: go build -v -o ./bin/om ./cmd/om

      - name: Show om version
        run: ./bin/om --version

      - name: Go build ox
        run: go build -v -o ./bin/ox ./cmd/ox

      - name: Show ox version
        run: ./bin/ox --version

      # Compiled as the runner user, in the caches above, and run as root:
      # sudo go test compiled in the caches of root, which nothing restores.
      - name: Run Go tests
        run: CGO_ENABLED=0 go test -exec sudo -ldflags=-w -timeout 120s ./...

  # The tests with race detector run on a runner of their own, along the
  # build and the tests without.
  race-test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # Ensures full history and tags are fetched

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Locate the Go caches
        id: go-cache
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      # The build cache of the race detector, of its own: see build-and-test.
      # The cache main saves on each push: restored only, a save of its own
      # being an upload of a gigabyte the job would wait for.
      - name: Restore the Go caches
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.build }}
            ${{ steps.go-cache.outputs.mod }}
          key: go-race-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-race-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}-
            go-race-${{ runner.os }}-

      - name: set opensvc version file
        run: git describe --tags --abbrev > ./util/version/text/VERSION

      - name: Run Go tests with race detector
        run: go test -exec sudo -ldflags=-w -timeout 600s --race ./...
