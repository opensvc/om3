name: Release Go Docker Push (Versioned)

on:
  release:
    types: [created]

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: opensvc

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6.0.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: go.sum

      - name: Create ~/bin directory
        run: mkdir -p $HOME/bin

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.51.1

      - name: Download CycloneDX CLI
        run: |
          curl -sSfL https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.33.1/cyclonedx-linux-x64 \
            -o $HOME/bin/cyclonedx
          echo "bfc8b2538da86fe239bc53658bbb63c1c8c510a293c1e6891aa5bea5d3c58746 $HOME/bin/cyclonedx" | sha256sum -c -
          chmod +x $HOME/bin/cyclonedx

      - name: Add ~/bin to PATH
        run: echo "$HOME/bin" >> $GITHUB_PATH

      - name: Go build om
        run: go build -v ./cmd/om

      - name: Go build ox
        run: go build -v ./cmd/ox

      - name: Run Go tests
        run: go test -p 1 -timeout 60s ./...

      - name: Run Go tests with race detector
        run: go test -p 1 -timeout 600s --race ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract release version
        id: version
        run: |
          # Extract version from tag, removing 'v' prefix if present
          VERSION=${{ github.ref_name }}
          echo "version=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Extract metadata (tags, labels) for om
        id: meta-om
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/om
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push om
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/om/Dockerfile
          push: true
          tags: ${{ steps.meta-om.outputs.tags }}
          labels: |
            ${{ steps.meta-om.outputs.labels }}
            org.opencontainers.image.authors=OpenSVC SAS
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=https://github.com/opensvc/om3
            org.opencontainers.image.url=https://github.com/opensvc/om3
            org.opencontainers.image.title=OpenSVC cluster orchestrator
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILDTIME=${{ github.event.repository.updated_at }}

      - name: Extract metadata (tags, labels) for ox
        id: meta-ox
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ox
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push ox
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ox/Dockerfile
          push: true
          tags: ${{ steps.meta-ox.outputs.tags }}
          labels: |
            ${{ steps.meta-ox.outputs.labels }}
            org.opencontainers.image.authors=OpenSVC SAS
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=https://github.com/opensvc/om3
            org.opencontainers.image.url=https://github.com/opensvc/om3
            org.opencontainers.image.title=OpenSVC cluster orchestrator client
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILDTIME=${{ github.event.repository.updated_at }}

      - name: Extract metadata (tags, labels) for omx
        id: meta-omx
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/omx
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push omx
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/omx/Dockerfile
          push: true
          tags: ${{ steps.meta-omx.outputs.tags }}
          labels: |
            ${{ steps.meta-omx.outputs.labels }}
            org.opencontainers.image.authors=OpenSVC SAS
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=https://github.com/opensvc/om3
            org.opencontainers.image.url=https://github.com/opensvc/om3
            org.opencontainers.image.title=OpenSVC cluster orchestrator server & client
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILDTIME=${{ github.event.repository.updated_at }}
            OM_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/om:${{ steps.version.outputs.version }}
            OX_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/ox:${{ steps.version.outputs.version }}

      - name: Generate SBOM
        run: syft scan . -o cyclonedx-json=sbom.json

      - name: Validate SBOM
        run: cyclonedx validate --input-file sbom.json

      - name: Upload sbom.json to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" sbom.json
